name: CI for Weather Backend

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/weather-backend:${{ github.sha }}

      - name: Update GitOps Tag
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          
          # שיבוט הריפו של הגיטופס
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/moti-art/weather-gitops.git
          cd weather-gitops/charts/weather-app
          
          # החלפת ה-tag רק בתוך הבלוק של ה-backend
          sed -i '/backend:/,/tag:/ s/tag: .*/tag: "${{ github.sha }}"/' values-dev.yaml
          
          if [ -n "$(git status --porcelain)" ]; then
            git add values-dev.yaml
            git commit -m "chore: update backend tag to ${{ github.sha }}"
            git push
          else
            echo "No changes to commit"
          fi